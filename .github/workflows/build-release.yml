name: Build Check

on:
  push:
    branches: [master]
    paths:
      - 'arduino/**'
      - 'shared-ui/**'
      - '.github/workflows/build-release.yml'
  pull_request:
    paths:
      - 'arduino/**'
      - 'shared-ui/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tools
      run: pip install platformio

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: pio-${{ hashFiles('arduino/platformio.ini') }}
        restore-keys: pio-

    - name: Build SuperMini firmware + filesystem
      run: |
        export PATH="$HOME/.platformio/packages/tool-mklittlefs:$PATH"
        cd arduino
        pio run -e supermini
        pio run -e supermini -t buildfs

    - name: Build XIAO firmware + filesystem
      run: |
        export PATH="$HOME/.platformio/packages/tool-mklittlefs:$PATH"
        cd arduino
        pio run -e xiao
        pio run -e xiao -t buildfs
